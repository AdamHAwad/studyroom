name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Install poppler (Windows)
        if: runner.os == 'Windows'
        run: choco install poppler -y --no-progress
      - run: npm run build
      - run: npm test
      - run: node scripts/smoke.mjs
      - name: Verify autostart installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node scripts/install-startup.mjs
          $startup = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Startup\studyroom.vbs'
          if (-not (Test-Path $startup)) { throw "Windows autostart entry was not created" }
          Write-Host "Windows autostart entry created: $startup"
